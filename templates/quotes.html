<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quotes</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    </head>

    <body>

        {% extends "navbar.html" %}

        {% block content %}
        
        <h1>Quotes</h1>

        <form action="/crawl" method="GET">
            <button type="submit">
                更新資料
            </button>
        </form>

        <hr>

        {% for quote in quote_list %}

            <div>
                <p>
                    {{ quote.text }}
                </p>

                <p>
                    - {{ quote.author }}
                </p>
            </div>

            <hr>

        {% endfor %}
    
        {% endblock %}
    </body>
</html>
